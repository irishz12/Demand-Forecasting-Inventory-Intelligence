services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: demand-forecasting-api:latest
    container_name: demand-forecasting-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: demand-forecasting-frontend:latest
    container_name: demand-forecasting-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
